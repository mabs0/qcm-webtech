name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"  # tous les jours : récupère les nouvelles questions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Si l'API est en panne, on garde l'instantané commité
      - name: Récupérer les questions
        run: python3 scripts/fetch_questions.py || echo "API injoignable, instantané conservé"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
